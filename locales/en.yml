en:
  theme_metadata:
    description: Adds a banner to pages created with Discourse Custom Topic Lists and can hide the Custom Lists dropdown elsewhere
    settings:
      hide_custom_lists_dropdown: "Hide the Custom Lists dropdown in the navigation breadcrumb everywhere except on list pages (/lists/...)."
      list_banners:
        description: "Lists themselves are created and managed with Discourse Custom Topic Lists (https://meta.discourse.org/t/discourse-custom-topic-lists/311186). Add a row for each list that should show a banner. The banner takes its title and description from the list in Custom Topic Lists unless a row sets its own. The banner's title and description come from the list in Custom Topic Lists, so set them there. A list with a banner shows it in place of the plugin's own title header."
        schema:
          properties:
            slug:
              label: "List slug"
              description: "The slug of the list as set in Custom Topic Lists, e.g. events for /lists/events"
            color:
              label: "Accent color"
              description: "Optional color of the banner's top border, as a hex value like #BF1E2E or a color name. Defaults to the theme's accent color, like category banners."
            buttons:
              text:
                label: "Text"
                description: "Button text"
              url:
                label: "URL"
                description: "A full https:// link, or a path on this site such as /t/123"
            thumbnails:
              label: "Thumbnails"
              description: "Layout from the Topic List Thumbnails theme for this list. Choose default to use that theme's own settings. Needs that theme installed."
            hide_navigation:
              label: "Hide navigation bar"
              description: "Hide the category, tag and latest/new/top bar on this list page, so the list stands on its own."
