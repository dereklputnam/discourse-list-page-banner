hide_custom_lists_dropdown:
  type: bool
  default: true
list_banners:
  type: objects
  default: []
  schema:
    name: banner
    identifier: slug
    properties:
      slug:
        type: string
        required: true
        validations:
          min_length: 1
      title:
        type: string
        required: true
        validations:
          min_length: 1
      description:
        type: string
      color:
        type: string
