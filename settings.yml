hide_custom_lists_dropdown:
  type: bool
  default: true
list_banners:
  type: objects
  default: []
  schema:
    name: banner
    identifier: slug
    properties:
      slug:
        type: string
        required: true
        validations:
          min_length: 1
      color:
        type: string
      hide_navigation:
        type: boolean
      thumbnails:
        type: enum
        choices:
          - default
          - blog-style
          - grid
          - list
          - masonry
          - minimal-grid
          - none
      buttons:
        type: objects
        schema:
          name: button
          identifier: text
          properties:
            text:
              type: string
              required: true
              validations:
                min_length: 1
            url:
              type: string
              required: true
              validations:
                min_length: 1
